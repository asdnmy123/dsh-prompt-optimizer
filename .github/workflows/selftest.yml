name: selftest

# 硬规矩：离线自测不全绿，不许合。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 离线自测（零依赖）
        run: node tools/selftest.mjs
      - name: 语法体检
        run: |
          node --check index.js
          node --check client.js
